name: Quickstart

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4

      - name: Install Python dependencies
        run: uv sync

      - name: Start grctld server
        run: grctld &

      - name: Wait for grctld to be ready
        run: |
          for i in $(seq 1 30); do
            nc -z localhost 4225 && echo "grctld ready" && break
            echo "Waiting for grctld... ($i/30)"
            sleep 1
          done

      - name: Start worker
        run: mise run worker &

      - name: Wait for worker to register workflows
        run: sleep 3

      - name: Run Hello workflow and verify it completes
        run: mise client
